# Fab registration must select this file with netlify_config = "netlify.toml".
# The site is dependency-free static HTML; do not run npm install/build.
[build]
publish = "dist"
command = "test -s dist/index.html && test -s dist/distro.css && test -s dist/theme/theme.css && test -s dist/theme/REVISION && test -s dist/theme/switcher.js && test -s dist/theme/docs.js && test -s dist/projects/dcp.html && test -s dist/projects/dcp.md && test -s dist/projects/umie.md && test -s dist/projects/unibus.md && test -s dist/projects/umie.html && test -s dist/projects/unibus.html && test -s dist/theme/umie.svg && test -s dist/theme/unibus.svg && test -s dist/docs/install.html && test -s dist/docs/base.html && test -s dist/docs/updates.html && test -s dist/assets/fungos.svg"
